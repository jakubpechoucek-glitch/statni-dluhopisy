<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dluhopis Republiky – kalkulačka výnosů</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #0b0f1a; overflow: hidden; }

    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 3px; background: #1e2540; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent, #1a6fff); cursor: pointer; border: 2px solid #0b0f1a; }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent, #1a6fff); cursor: pointer; border: 2px solid #0b0f1a; }
    input[type=range]:disabled { opacity: 0.4; cursor: default; }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      grid-template-rows: 100vh;
      height: 100vh;
      font-family: 'DM Mono', 'Fira Mono', 'Courier New', monospace;
      color: #e8eaf2;
    }

    .left-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px 18px 20px 20px;
      border-right: 1px solid #1e2540;
      overflow: hidden;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px 20px 20px 18px;
      overflow: hidden;
    }

    .panel {
      background: #13182a;
      border: 1px solid #1e2540;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .panel-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #5a6080;
      margin-bottom: 8px;
    }

    .card {
      background: #13182a;
      border: 1px solid #1e2540;
      border-radius: 10px;
      padding: 12px 14px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
      flex: 1;
    }
    .card.best {
      background: #0f1e38;
    }

    /* mobile fallback – scroll allowed below 800px */
    @media (max-width: 800px) {
      body { overflow: auto; }
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        height: auto;
      }
      .left-col, .right-col { padding: 16px; border-right: none; }
      .left-col { border-bottom: 1px solid #1e2540; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const FIXED_RATE_BY_YEAR = [0.035, 0.035, 0.045, 0.045, 0.065];
    const FLEXI_RATE = 0.035;
    const BAR_COLORS = { fixed: "#1a6fff", flexi: "#00c896", inflation: "#ff7a3d" };

    const PRESETS = [
      { value: 10_000,    cs: "10 tis.",  en: "10K" },
      { value: 50_000,    cs: "50 tis.",  en: "50K" },
      { value: 100_000,   cs: "100 tis.", en: "100K" },
      { value: 500_000,   cs: "500 tis.", en: "500K" },
      { value: 1_000_000, cs: "1 mil.",   en: "1M" },
      { value: 3_000_000, cs: "3 mil.",   en: "3M" },
    ];

    const TR = {
      cs: {
        headerSub: "Ministerstvo financí ČR · Emise 15. 7. 2026",
        headerTitle: "Dluhopis Republiky",
        investmentLabel: "Investovaná částka",
        periodLabel: "Délka investice",
        yearWord: (y) => y === 1 ? "rok" : y < 5 ? "roky" : "let",
        yearShort: "r",
        inflationTitle: "Scénář inflace",
        inflationAvg: (y) => `Prům. za ${y} ${y === 1 ? "rok" : "let"}`,
        modeUnified: "Stejná",
        modePerYear: "Po letech",
        sliderAllYears: "Všechny roky",
        sliderYear: (y) => `Rok ${y}`,
        bestYield: "Nejvyšší výnos",
        annualAvg: "Roční průměr",
        perYear: "/ rok",
        chartTitle: "Vývoj hodnoty (Kč)",
        legendFixed: "Fixní",
        legendInflation: (pct) => `Protiinfl. (ø ${pct})`,
        legendFlexi: "Flexi Bond",
        notesTitle: "Upozornění",
        notes: [
          "Osvobozeno od 15% srážkové daně – čisté částky",
          "Fixní: stupňovité úročení, plný výnos až v 5. roce",
          "Protiinflační: výnos = skutečná CPI každý rok",
          "Flexi Bond: sazba se může měnit každé čtvrtletí",
          "Limit 3 mil. Kč na každý typ zvlášť",
        ],
        bonds: (avgInfl) => [
          { key: "fixed",     label: "Fixní dluhopis", icon: "🔵", sublabel: "5letý · ø 4,544 % p.a.",             note: "Stupňovitý výnos – max v 5. roce" },
          { key: "inflation", label: "Protiinflační",  icon: "🟠", sublabel: `5letý · CPI ø ${fmtPct(avgInfl)}`,   note: "Výnos = inflace (tvůj scénář)" },
          { key: "flexi",     label: "Flexi Bond",     icon: "🟢", sublabel: "3měs. · 3,5 % p.a.",                  note: "Obnovuje se každé 3 měsíce" },
        ],
      },
      en: {
        headerSub: "Ministry of Finance CR · Issue 15 Jul 2026",
        headerTitle: "Republic Bond",
        investmentLabel: "Investment amount",
        periodLabel: "Investment period",
        yearWord: (y) => y === 1 ? "year" : "years",
        yearShort: "y",
        inflationTitle: "Inflation scenario",
        inflationAvg: (y) => `Avg over ${y} ${y === 1 ? "year" : "years"}`,
        modeUnified: "Unified",
        modePerYear: "Per year",
        sliderAllYears: "All years",
        sliderYear: (y) => `Year ${y}`,
        bestYield: "Best yield",
        annualAvg: "Annual avg",
        perYear: "/ yr",
        chartTitle: "Value over time (CZK)",
        legendFixed: "Fixed",
        legendInflation: (pct) => `Infl.-linked (ø ${pct})`,
        legendFlexi: "Flexi Bond",
        notesTitle: "Notice",
        notes: [
          "Exempt from 15% withholding tax – net amounts",
          "Fixed: stepped yield, full rate only in year 5",
          "Inflation-linked: yield = actual CPI each year",
          "Flexi Bond: rate may change every quarter",
          "3M CZK limit applies per bond type",
        ],
        bonds: (avgInfl) => [
          { key: "fixed",     label: "Fixed Bond",       icon: "🔵", sublabel: `5-year · ø 4.544% p.a.`,              note: "Stepped yield – max in year 5" },
          { key: "inflation", label: "Inflation-linked", icon: "🟠", sublabel: `5-year · CPI ø ${fmtPct(avgInfl)}`,    note: "Yield = inflation (your scenario)" },
          { key: "flexi",     label: "Flexi Bond",       icon: "🟢", sublabel: "3-month · 3.5% p.a.",                  note: "Auto-renews every 3 months" },
        ],
      },
    };

    function calcFixed(inv) {
      let value = inv;
      const results = [{ year: 0, value: inv, gain: 0 }];
      for (let y = 1; y <= 5; y++) {
        value = value * (1 + FIXED_RATE_BY_YEAR[y - 1]);
        results.push({ year: y, value: Math.round(value), gain: Math.round(value - inv) });
      }
      return results;
    }
    function calcFlexi(inv) {
      let value = inv;
      const results = [{ year: 0, value: inv, gain: 0 }];
      for (let y = 1; y <= 5; y++) {
        value = value * (1 + FLEXI_RATE);
        results.push({ year: y, value: Math.round(value), gain: Math.round(value - inv) });
      }
      return results;
    }
    function calcInflation(inv, ratesByYear) {
      let value = inv;
      const results = [{ year: 0, value: inv, gain: 0 }];
      for (let y = 1; y <= 5; y++) {
        value = value * (1 + ratesByYear[y - 1]);
        results.push({ year: y, value: Math.round(value), gain: Math.round(value - inv) });
      }
      return results;
    }

    function fmt(n) { return n.toLocaleString("cs-CZ") + " Kč"; }
    function fmtGain(n) { return (n >= 0 ? "+" : "") + n.toLocaleString("cs-CZ") + " Kč"; }
    function fmtPct(r) { return (r * 100).toFixed(1) + " %"; }
    function fmtInv(n, lang) {
      if (lang === "en") {
        if (n >= 1_000_000) return (n / 1_000_000).toLocaleString("en-GB", { maximumFractionDigits: 2 }) + "M CZK";
        if (n >= 1_000)     return (n / 1_000).toLocaleString("en-GB", { maximumFractionDigits: 0 }) + "K CZK";
        return n + " CZK";
      }
      if (n >= 1_000_000) return (n / 1_000_000).toLocaleString("cs-CZ", { maximumFractionDigits: 2 }) + " mil. Kč";
      if (n >= 1_000)     return (n / 1_000).toLocaleString("cs-CZ", { maximumFractionDigits: 0 }) + " tis. Kč";
      return n.toLocaleString("cs-CZ") + " Kč";
    }

    function LangSwitcher({ lang, setLang }) {
      return (
        <div style={{ display: "flex", gap: 4 }}>
          {[{ code: "cs", flag: "🇨🇿" }, { code: "en", flag: "🇬🇧" }].map(({ code, flag }) => (
            <button key={code} onClick={() => setLang(code)}
              style={{
                background: lang === code ? "#1e2540" : "transparent",
                border: `1px solid ${lang === code ? "#3a4060" : "transparent"}`,
                borderRadius: 7, padding: "3px 8px", cursor: "pointer",
                fontFamily: "inherit", fontSize: 16, lineHeight: 1.2,
                transition: "all 0.15s",
              }}
            >{flag}</button>
          ))}
        </div>
      );
    }

    function SliderRow({ label, value, onChange, dimmed }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, opacity: dimmed ? 0.35 : 1, transition: "opacity 0.2s" }}>
          <span style={{ fontSize: 10, color: "#5a6080", minWidth: 46 }}>{label}</span>
          <input type="range" min={0} max={15} step={0.5}
            value={value * 100}
            onChange={e => onChange(Number(e.target.value) / 100)}
            style={{ flex: 1, "--accent": BAR_COLORS.inflation }}
            disabled={dimmed}
          />
          <span style={{
            fontSize: 11, fontWeight: 700, minWidth: 38, textAlign: "right",
            color: value >= 0.05 ? "#ff7a3d" : value >= 0.03 ? "#e8eaf2" : "#a0a8c0",
          }}>{fmtPct(value)}</span>
        </div>
      );
    }

    function App() {
      const [lang, setLang] = useState("cs");
      const [investment, setInvestment] = useState(3_000_000);
      const [year, setYear] = useState(5);
      const [inflMode, setInflMode] = useState("unified");
      const [unifiedRate, setUnifiedRate] = useState(0.035);
      const [perYearRates, setPerYearRates] = useState([0.025, 0.030, 0.035, 0.040, 0.045]);

      const t = TR[lang];
      const inflRates = inflMode === "unified" ? Array(5).fill(unifiedRate) : perYearRates;

      const fixedData     = calcFixed(investment);
      const flexiData     = calcFlexi(investment);
      const inflationData = calcInflation(investment, inflRates);

      const avgInfl     = inflRates.slice(0, year).reduce((a, b) => a + b, 0) / year;
      const fixedAtYear  = fixedData[year];
      const flexiAtYear  = flexiData[year];
      const inflAtYear   = inflationData[year];

      const maxVal = Math.max(fixedAtYear.value, flexiAtYear.value, inflAtYear.value);

      const bonds = t.bonds(avgInfl).map((b, i) => ({
        ...b,
        color: [BAR_COLORS.fixed, BAR_COLORS.inflation, BAR_COLORS.flexi][i],
        data:  [fixedAtYear, inflAtYear, flexiAtYear][i],
      }));

      const allVals  = [...fixedData, ...flexiData, ...inflationData].map(d => d.value);
      const chartMax = Math.max(...allVals);
      const chartMin = investment;
      const toX = y => 44 + (y / 5) * 390;
      const toY = v => 100 - ((v - chartMin) / (chartMax - chartMin + 1)) * 82;

      return (
        <div className="layout">

          {/* ── LEFT COLUMN: controls ── */}
          <div className="left-col">

            {/* Header */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontSize: 9, letterSpacing: "0.2em", color: "#5a6080", textTransform: "uppercase", marginBottom: 4 }}>
                  {t.headerSub}
                </div>
                <h1 style={{
                  fontSize: "clamp(18px, 2.5vw, 24px)", fontWeight: 700,
                  fontFamily: "'DM Serif Display', Georgia, serif",
                  color: "#fff", lineHeight: 1.1,
                }}>
                  {t.headerTitle}
                </h1>
              </div>
              <LangSwitcher lang={lang} setLang={setLang} />
            </div>

            {/* Investment amount */}
            <div className="panel">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div className="panel-label" style={{ marginBottom: 0 }}>{t.investmentLabel}</div>
                <span style={{ fontSize: 17, fontWeight: 700, color: "#fff", fontFamily: "'DM Serif Display', Georgia, serif" }}>
                  {fmtInv(investment, lang)}
                </span>
              </div>
              <input type="range" min={1_000} max={3_000_000} step={1_000} value={investment}
                onChange={e => setInvestment(Number(e.target.value))}
                style={{ "--accent": "#a0a8c0" }}
              />
              <div style={{ display: "flex", gap: 4, marginTop: 10, flexWrap: "wrap" }}>
                {PRESETS.map(p => (
                  <button key={p.value} onClick={() => setInvestment(p.value)}
                    style={{
                      flex: "1 1 auto",
                      background: investment === p.value ? "#e8eaf2" : "#0b0f1a",
                      color: investment === p.value ? "#0b0f1a" : "#5a6080",
                      border: `1px solid ${investment === p.value ? "#e8eaf2" : "#1e2540"}`,
                      borderRadius: 6, padding: "5px 6px",
                      fontSize: 11, fontWeight: 700, cursor: "pointer",
                      fontFamily: "inherit", transition: "all 0.15s", whiteSpace: "nowrap",
                    }}
                  >{p[lang]}</button>
                ))}
              </div>
            </div>

            {/* Year slider */}
            <div className="panel">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div className="panel-label" style={{ marginBottom: 0 }}>{t.periodLabel}</div>
                <span style={{ fontSize: 17, fontWeight: 700, color: "#fff", fontFamily: "'DM Serif Display', Georgia, serif" }}>
                  {year} {t.yearWord(year)}
                </span>
              </div>
              <input type="range" min={1} max={5} value={year}
                onChange={e => setYear(Number(e.target.value))}
                style={{ "--accent": "#1a6fff" }}
              />
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, marginTop: 5 }}>
                {[1,2,3,4,5].map(y => (
                  <span key={y} style={{ color: y === year ? "#1a6fff" : "#3a4060", fontWeight: y === year ? 700 : 400 }}>
                    {y}{t.yearShort}
                  </span>
                ))}
              </div>
            </div>

            {/* Inflation */}
            <div className="panel" style={{ borderColor: "#ff7a3d33", flex: 1, display: "flex", flexDirection: "column" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <div>
                  <div style={{ fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase", color: "#ff7a3d" }}>
                    🟠 {t.inflationTitle}
                  </div>
                  <div style={{ fontSize: 10, color: "#5a6080", marginTop: 2 }}>
                    {t.inflationAvg(year)}: <strong style={{ color: "#ff7a3d" }}>{fmtPct(avgInfl)}</strong>
                  </div>
                </div>
                <div style={{ display: "flex", background: "#0b0f1a", borderRadius: 6, padding: 2, gap: 2 }}>
                  {[["unified", t.modeUnified], ["peryear", t.modePerYear]].map(([val, lbl]) => (
                    <button key={val} onClick={() => setInflMode(val)}
                      style={{
                        background: inflMode === val ? "#ff7a3d" : "transparent",
                        color: inflMode === val ? "#000" : "#5a6080",
                        border: "none", borderRadius: 5, padding: "4px 8px",
                        fontSize: 10, fontWeight: 700, cursor: "pointer",
                        fontFamily: "inherit", transition: "all 0.2s", whiteSpace: "nowrap",
                      }}
                    >{lbl}</button>
                  ))}
                </div>
              </div>

              <div style={{ flex: 1 }}>
                {inflMode === "unified" ? (
                  <SliderRow label={t.sliderAllYears} value={unifiedRate} onChange={setUnifiedRate} dimmed={false} />
                ) : (
                  [1,2,3,4,5].map(y => (
                    <SliderRow key={y} label={t.sliderYear(y)}
                      value={perYearRates[y - 1]}
                      dimmed={y > year}
                      onChange={v => {
                        const next = [...perYearRates];
                        next[y - 1] = v;
                        setPerYearRates(next);
                      }}
                    />
                  ))
                )}
              </div>

              {/* Mini bar chart */}
              <div style={{ display: "flex", gap: 3, marginTop: 8 }}>
                {inflRates.map((r, i) => (
                  <div key={i} style={{ flex: 1, textAlign: "center" }}>
                    <div style={{
                      height: 24, background: "#0b0f1a", borderRadius: 3, position: "relative",
                      overflow: "hidden",
                      border: i < year ? "1px solid #ff7a3d44" : "1px solid #1e2540",
                      opacity: i < year ? 1 : 0.3,
                    }}>
                      <div style={{
                        position: "absolute", bottom: 0, left: 0, right: 0,
                        height: `${Math.max(4, (r / 0.15) * 100)}%`,
                        background: "linear-gradient(to top, #ff7a3d, #ff7a3d88)",
                        transition: "height 0.3s ease",
                      }} />
                    </div>
                    <div style={{ fontSize: 8, color: i < year ? "#ff7a3d" : "#3a4060", marginTop: 2 }}>{fmtPct(r)}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Notes */}
            <div style={{ background: "#13182a", border: "1px solid #1e2540", borderRadius: 10, padding: "10px 12px" }}>
              <div style={{ fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#3a4060", marginBottom: 6 }}>
                {t.notesTitle}
              </div>
              {t.notes.map((n, i) => (
                <div key={i} style={{ fontSize: 10, color: "#3a4060", lineHeight: 1.5 }}>· {n}</div>
              ))}
            </div>
          </div>

          {/* ── RIGHT COLUMN: results ── */}
          <div className="right-col">

            {/* 3 bond cards */}
            <div style={{ display: "flex", gap: 10, flex: "0 0 auto" }}>
              {bonds.map((b) => {
                const isMax = b.data.value === maxVal;
                const gainPct = ((b.data.gain / investment) * 100).toFixed(1);
                return (
                  <div key={b.key} className={`card${isMax ? " best" : ""}`}
                    style={{ border: `1px solid ${isMax ? b.color + "55" : "#1e2540"}` }}
                  >
                    {isMax && (
                      <div style={{
                        position: "absolute", top: 8, right: 8,
                        background: b.color, color: "#000", fontSize: 8,
                        fontWeight: 700, letterSpacing: "0.1em",
                        padding: "2px 6px", borderRadius: 4, textTransform: "uppercase",
                      }}>{t.bestYield}</div>
                    )}
                    <div style={{
                      position: "absolute", bottom: 0, left: 0, height: 3, right: 0,
                      background: `linear-gradient(90deg, ${b.color}44, ${b.color})`,
                      borderRadius: "0 0 10px 10px",
                    }} />
                    <div style={{ fontSize: 11, color: "#5a6080", marginBottom: 4 }}>{b.icon} {b.sublabel}</div>
                    <div style={{ fontSize: 14, fontWeight: 700, color: "#fff", fontFamily: "'DM Serif Display', Georgia, serif", marginBottom: 2 }}>
                      {b.label}
                    </div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: "#fff", fontFamily: "'DM Serif Display', Georgia, serif", marginTop: 6 }}>
                      {fmt(b.data.value)}
                    </div>
                    <div style={{ fontSize: 13, color: b.color, fontWeight: 600, marginTop: 2 }}>
                      {fmtGain(b.data.gain)}
                    </div>
                    <div style={{ marginTop: 8, background: "#0b0f1a", borderRadius: 6, padding: "6px 10px", display: "flex", justifyContent: "space-between", fontSize: 10 }}>
                      <span style={{ color: "#3a4060" }}>{t.annualAvg}</span>
                      <span style={{ color: "#a0a8c0" }}>{fmt(Math.round(b.data.gain / year))} {t.perYear}</span>
                    </div>
                    <div style={{ marginTop: 6, fontSize: 10, color: "#2a3050" }}>⚠ {b.note}</div>
                  </div>
                );
              })}
            </div>

            {/* Line chart */}
            <div className="panel" style={{ flex: 1, display: "flex", flexDirection: "column" }}>
              <div className="panel-label">{t.chartTitle}</div>
              <svg viewBox="0 0 480 110" style={{ width: "100%", flex: 1 }} preserveAspectRatio="none">
                {[0,1,2,3].map(i => (
                  <line key={i} x1={44} x2={444} y1={10 + i * 30} y2={10 + i * 30}
                    stroke="#1e2540" strokeWidth="1" strokeDasharray="4,4" />
                ))}
                {[0,1,2,3].map(i => {
                  const val = chartMax - (i / 3) * (chartMax - chartMin);
                  return (
                    <text key={i} x={40} y={14 + i * 30} textAnchor="end" fontSize={8} fill="#3a4060">
                      {(val / 1_000_000).toFixed(2)}M
                    </text>
                  );
                })}
                {[
                  { data: fixedData,     color: BAR_COLORS.fixed },
                  { data: inflationData, color: BAR_COLORS.inflation },
                  { data: flexiData,     color: BAR_COLORS.flexi },
                ].map(({ data, color }) => {
                  const pts = data.map(d => `${toX(d.year)},${toY(d.value)}`).join(" ");
                  return (
                    <polyline key={color} points={pts} fill="none" stroke={color}
                      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                  );
                })}
                <line x1={toX(year)} x2={toX(year)} y1={5} y2={105}
                  stroke="#ffffff22" strokeWidth="1.5" strokeDasharray="3,3" />
                {[0,1,2,3,4,5].map(y => (
                  <text key={y} x={toX(y)} y={108} textAnchor="middle" fontSize={8} fill="#3a4060">
                    {y}{t.yearShort}
                  </text>
                ))}
              </svg>
              <div style={{ display: "flex", gap: 16, marginTop: 8, flexWrap: "wrap" }}>
                {[
                  { label: t.legendFixed,                      color: BAR_COLORS.fixed },
                  { label: t.legendInflation(fmtPct(avgInfl)), color: BAR_COLORS.inflation },
                  { label: t.legendFlexi,                      color: BAR_COLORS.flexi },
                ].map(l => (
                  <div key={l.label} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 10, color: "#5a6080" }}>
                    <div style={{ width: 16, height: 3, background: l.color, borderRadius: 2 }} />
                    {l.label}
                  </div>
                ))}
              </div>
            </div>

            <div style={{ textAlign: "right", fontSize: 9, color: "#2a3050", letterSpacing: "0.1em" }}>
              pssd.sporicidluhopisycr.cz · Kalkulace jsou orientační
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
