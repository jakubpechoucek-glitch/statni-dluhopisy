<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dluhopis Republiky – kalkulačka výnosů</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #0b0f1a; overflow: hidden; }

    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 3px; background: #1e2540; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent, #1a6fff); cursor: pointer; border: 2px solid #0b0f1a; }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent, #1a6fff); cursor: pointer; border: 2px solid #0b0f1a; }
    input[type=range]:disabled { opacity: 0.4; cursor: default; }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: 100vh;
      font-family: 'DM Mono', 'Fira Mono', 'Courier New', monospace;
      color: #e8eaf2;
    }

    .left-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 14px 16px 16px;
      border-right: 1px solid #1e2540;
      overflow: hidden;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 16px 16px 14px;
      overflow: hidden;
    }

    /* every direct panel child grows equally */
    .left-col > .tile,
    .right-col > .tile {
      flex: 1;
      min-height: 0;
      background: #13182a;
      border: 1px solid #1e2540;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .tile-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8090b8;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    @media (max-width: 800px) {
      body { overflow: auto; }
      .layout { grid-template-columns: 1fr; height: auto; }
      .left-col, .right-col { padding: 12px; border-right: none; }
      .left-col { border-bottom: 1px solid #1e2540; }
      .left-col > .tile, .right-col > .tile { flex: 0 0 auto; min-height: 120px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const FIXED_RATE_BY_YEAR = [0.035, 0.035, 0.045, 0.045, 0.065];
    const FLEXI_RATE = 0.035;
    const BAR_COLORS = { fixed: "#1a6fff", flexi: "#00c896", inflation: "#ff7a3d" };

    const PRESETS = [
      { value: 10_000,    cs: "10 tis.",  en: "10K" },
      { value: 50_000,    cs: "50 tis.",  en: "50K" },
      { value: 100_000,   cs: "100 tis.", en: "100K" },
      { value: 500_000,   cs: "500 tis.", en: "500K" },
      { value: 1_000_000, cs: "1 mil.",   en: "1M" },
      { value: 3_000_000, cs: "3 mil.",   en: "3M" },
    ];

    const TR = {
      cs: {
        headerSub: "Ministerstvo financí ČR · Emise 15. 7. 2026",
        headerTitle: "Dluhopis Republiky",
        investmentLabel: "Investovaná částka",
        periodLabel: "Délka investice",
        yearWord: (y) => y === 1 ? "rok" : y < 5 ? "roky" : "let",
        yearShort: "r",
        inflationTitle: "Scénář inflace",
        inflationAvg: (y) => `Průměr za ${y} ${y === 1 ? "rok" : "let"}`,
        modeUnified: "Stejná",
        modePerYear: "Po letech",
        sliderAllYears: "Všechny roky",
        sliderYear: (y) => `Rok ${y}`,
        bestYield: "Nejvyšší výnos",
        annualAvg: "Roční průměr",
        perYear: "/ rok",
        chartTitle: "Vývoj hodnoty v čase (Kč)",
        legendFixed: "Fixní",
        legendInflation: (pct) => `Protiinflační (ø ${pct})`,
        legendFlexi: "Flexi Bond",
        notesTitle: "Upozornění",
        notes: [
          "Osvobozeno od 15% srážkové daně – čisté částky",
          "Fixní: stupňovité úročení, plný výnos až v 5. roce",
          "Protiinflační: výnos = skutečná CPI každý rok",
          "Flexi Bond: sazba se může měnit každé čtvrtletí",
          "Limit 3 mil. Kč na každý typ zvlášť",
        ],
        bonds: (avgInfl) => [
          { key: "fixed",     label: "Fixní dluhopis", icon: "🔵", sublabel: "5letý · ø 4,544 % p.a.",           note: "Stupňovitý výnos – max v 5. roce" },
          { key: "inflation", label: "Protiinflační",  icon: "🟠", sublabel: `5letý · CPI ø ${fmtPct(avgInfl)}`, note: "Výnos = inflace (tvůj scénář)" },
          { key: "flexi",     label: "Flexi Bond",     icon: "🟢", sublabel: "3měs. · 3,5 % p.a.",               note: "Obnovuje se každé 3 měsíce" },
        ],
      },
      en: {
        headerSub: "Ministry of Finance CR · Issue 15 Jul 2026",
        headerTitle: "Republic Bond",
        investmentLabel: "Investment amount",
        periodLabel: "Investment period",
        yearWord: (y) => y === 1 ? "year" : "years",
        yearShort: "y",
        inflationTitle: "Inflation scenario",
        inflationAvg: (y) => `Average over ${y} ${y === 1 ? "year" : "years"}`,
        modeUnified: "Unified",
        modePerYear: "Per year",
        sliderAllYears: "All years",
        sliderYear: (y) => `Year ${y}`,
        bestYield: "Best yield",
        annualAvg: "Annual avg",
        perYear: "/ yr",
        chartTitle: "Value over time (CZK)",
        legendFixed: "Fixed",
        legendInflation: (pct) => `Inflation-linked (ø ${pct})`,
        legendFlexi: "Flexi Bond",
        notesTitle: "Notice",
        notes: [
          "Exempt from 15% withholding tax – net amounts",
          "Fixed: stepped yield, full rate only in year 5",
          "Inflation-linked: yield = actual CPI each year",
          "Flexi Bond: rate may change every quarter",
          "3M CZK limit applies per bond type",
        ],
        bonds: (avgInfl) => [
          { key: "fixed",     label: "Fixed Bond",       icon: "🔵", sublabel: "5-year · ø 4.544% p.a.",          note: "Stepped yield – max in year 5" },
          { key: "inflation", label: "Inflation-linked", icon: "🟠", sublabel: `5-year · CPI ø ${fmtPct(avgInfl)}`, note: "Yield = inflation (your scenario)" },
          { key: "flexi",     label: "Flexi Bond",       icon: "🟢", sublabel: "3-month · 3.5% p.a.",             note: "Auto-renews every 3 months" },
        ],
      },
    };

    function calcFixed(inv) {
      let value = inv;
      const r = [{ year: 0, value: inv, gain: 0 }];
      for (let y = 1; y <= 5; y++) { value *= 1 + FIXED_RATE_BY_YEAR[y-1]; r.push({ year: y, value: Math.round(value), gain: Math.round(value - inv) }); }
      return r;
    }
    function calcFlexi(inv) {
      let value = inv;
      const r = [{ year: 0, value: inv, gain: 0 }];
      for (let y = 1; y <= 5; y++) { value *= 1 + FLEXI_RATE; r.push({ year: y, value: Math.round(value), gain: Math.round(value - inv) }); }
      return r;
    }
    function calcInflation(inv, rates) {
      let value = inv;
      const r = [{ year: 0, value: inv, gain: 0 }];
      for (let y = 1; y <= 5; y++) { value *= 1 + rates[y-1]; r.push({ year: y, value: Math.round(value), gain: Math.round(value - inv) }); }
      return r;
    }

    function fmt(n) { return n.toLocaleString("cs-CZ") + " Kč"; }
    function fmtGain(n) { return (n >= 0 ? "+" : "") + n.toLocaleString("cs-CZ") + " Kč"; }
    function fmtPct(r) { return (r * 100).toFixed(1) + " %"; }
    function fmtInv(n, lang) {
      if (lang === "en") {
        if (n >= 1_000_000) return (n/1_000_000).toLocaleString("en-GB",{maximumFractionDigits:2}) + "M CZK";
        if (n >= 1_000)     return (n/1_000).toLocaleString("en-GB",{maximumFractionDigits:0}) + "K CZK";
        return n + " CZK";
      }
      if (n >= 1_000_000) return (n/1_000_000).toLocaleString("cs-CZ",{maximumFractionDigits:2}) + " mil. Kč";
      if (n >= 1_000)     return (n/1_000).toLocaleString("cs-CZ",{maximumFractionDigits:0}) + " tis. Kč";
      return n.toLocaleString("cs-CZ") + " Kč";
    }

    function LangSwitcher({ lang, setLang }) {
      return (
        <div style={{ display: "flex", gap: 4 }}>
          {[{ code:"cs", flag:"🇨🇿" }, { code:"en", flag:"🇬🇧" }].map(({ code, flag }) => (
            <button key={code} onClick={() => setLang(code)} style={{
              background: lang === code ? "#1e2540" : "transparent",
              border: `1px solid ${lang === code ? "#3a4060" : "transparent"}`,
              borderRadius: 7, padding: "3px 8px", cursor: "pointer",
              fontFamily: "inherit", fontSize: 16, lineHeight: 1.2, transition: "all 0.15s",
            }}>{flag}</button>
          ))}
        </div>
      );
    }

    function SliderRow({ label, value, onChange, dimmed }) {
      return (
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:5, opacity: dimmed ? 0.35 : 1, transition:"opacity 0.2s" }}>
          <span style={{ fontSize:12, color:"#8090b8", minWidth:54, flexShrink:0 }}>{label}</span>
          <input type="range" min={0} max={15} step={0.5} value={value*100}
            onChange={e => onChange(Number(e.target.value)/100)}
            style={{ flex:1, "--accent": BAR_COLORS.inflation }} disabled={dimmed} />
          <span style={{
            fontSize:13, fontWeight:700, minWidth:42, textAlign:"right",
            color: value>=0.05 ? "#ff7a3d" : value>=0.03 ? "#e8eaf2" : "#b0b8d0",
          }}>{fmtPct(value)}</span>
        </div>
      );
    }

    function App() {
      const [lang, setLang] = useState("cs");
      const [investment, setInvestment] = useState(3_000_000);
      const [year, setYear] = useState(5);
      const [inflMode, setInflMode] = useState("unified");
      const [unifiedRate, setUnifiedRate] = useState(0.035);
      const [perYearRates, setPerYearRates] = useState([0.025,0.030,0.035,0.040,0.045]);

      const t = TR[lang];
      const inflRates = inflMode === "unified" ? Array(5).fill(unifiedRate) : perYearRates;

      const fixedData     = calcFixed(investment);
      const flexiData     = calcFlexi(investment);
      const inflationData = calcInflation(investment, inflRates);

      const avgInfl    = inflRates.slice(0, year).reduce((a,b) => a+b, 0) / year;
      const fixedAtYear = fixedData[year];
      const flexiAtYear = flexiData[year];
      const inflAtYear  = inflationData[year];
      const maxVal = Math.max(fixedAtYear.value, flexiAtYear.value, inflAtYear.value);

      const bonds = t.bonds(avgInfl).map((b, i) => ({
        ...b,
        color: [BAR_COLORS.fixed, BAR_COLORS.inflation, BAR_COLORS.flexi][i],
        data:  [fixedAtYear, inflAtYear, flexiAtYear][i],
      }));

      const allVals  = [...fixedData,...flexiData,...inflationData].map(d => d.value);
      const chartMax = Math.max(...allVals);
      const chartMin = investment;
      const toX = y => 44 + (y/5)*390;
      const toY = v => 85 - ((v-chartMin)/(chartMax-chartMin+1))*75;

      return (
        <div className="layout">

          {/* ── LEFT: controls ── */}
          <div className="left-col">

            {/* Tile 1: header + investment */}
            <div className="tile">
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8 }}>
                <div>
                  <div style={{ fontSize:11, letterSpacing:"0.15em", color:"#8090b8", textTransform:"uppercase", marginBottom:3 }}>{t.headerSub}</div>
                  <h1 style={{ fontSize:"clamp(16px,2vw,22px)", fontWeight:700, fontFamily:"'DM Serif Display',Georgia,serif", color:"#fff", lineHeight:1.1 }}>
                    {t.headerTitle}
                  </h1>
                </div>
                <LangSwitcher lang={lang} setLang={setLang} />
              </div>
              <div>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                  <div className="tile-label" style={{ marginBottom:0 }}>{t.investmentLabel}</div>
                  <span style={{ fontSize:19, fontWeight:700, color:"#fff", fontFamily:"'DM Serif Display',Georgia,serif" }}>{fmtInv(investment, lang)}</span>
                </div>
                <input type="range" min={1_000} max={3_000_000} step={1_000} value={investment}
                  onChange={e => setInvestment(Number(e.target.value))}
                  style={{ "--accent":"#a0a8c0" }} />
                <div style={{ display:"flex", gap:4, marginTop:8, flexWrap:"wrap" }}>
                  {PRESETS.map(p => (
                    <button key={p.value} onClick={() => setInvestment(p.value)} style={{
                      flex:"1 1 auto",
                      background: investment===p.value ? "#e8eaf2" : "#0b0f1a",
                      color: investment===p.value ? "#0b0f1a" : "#5a6080",
                      border: `1px solid ${investment===p.value ? "#e8eaf2" : "#1e2540"}`,
                      borderRadius:6, padding:"5px 4px", fontSize:11, fontWeight:700,
                      cursor:"pointer", fontFamily:"inherit", transition:"all 0.15s", whiteSpace:"nowrap",
                    }}>{p[lang]}</button>
                  ))}
                </div>
              </div>
            </div>

            {/* Tile 2: year */}
            <div className="tile">
              <div className="tile-label">{t.periodLabel}</div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                <span style={{ fontSize:32, fontWeight:700, color:"#fff", fontFamily:"'DM Serif Display',Georgia,serif" }}>{year}</span>
                <span style={{ fontSize:16, color:"#b0b8d0" }}>{t.yearWord(year)}</span>
              </div>
              <input type="range" min={1} max={5} value={year}
                onChange={e => setYear(Number(e.target.value))}
                style={{ "--accent":"#1a6fff" }} />
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginTop:6 }}>
                {[1,2,3,4,5].map(y => (
                  <span key={y} style={{ color: y===year ? "#1a6fff" : "#6070a0", fontWeight: y===year ? 700 : 400 }}>
                    {y}{t.yearShort}
                  </span>
                ))}
              </div>
            </div>

            {/* Tile 3: inflation */}
            <div className="tile" style={{ borderColor:"#ff7a3d33" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                <div>
                  <div style={{ fontSize:11, letterSpacing:"0.12em", textTransform:"uppercase", color:"#ff7a3d" }}>🟠 {t.inflationTitle}</div>
                  <div style={{ fontSize:12, color:"#8090b8", marginTop:2 }}>
                    {t.inflationAvg(year)}: <strong style={{ color:"#ff7a3d" }}>{fmtPct(avgInfl)}</strong>
                  </div>
                </div>
                <div style={{ display:"flex", background:"#0b0f1a", borderRadius:6, padding:2, gap:2 }}>
                  {[["unified", t.modeUnified],["peryear", t.modePerYear]].map(([val, lbl]) => (
                    <button key={val} onClick={() => setInflMode(val)} style={{
                      background: inflMode===val ? "#ff7a3d" : "transparent",
                      color: inflMode===val ? "#000" : "#5a6080",
                      border:"none", borderRadius:5, padding:"4px 8px",
                      fontSize:10, fontWeight:700, cursor:"pointer",
                      fontFamily:"inherit", transition:"all 0.2s", whiteSpace:"nowrap",
                    }}>{lbl}</button>
                  ))}
                </div>
              </div>
              <div style={{ flex:1 }}>
                {inflMode === "unified"
                  ? <SliderRow label={t.sliderAllYears} value={unifiedRate} onChange={setUnifiedRate} dimmed={false} />
                  : [1,2,3,4,5].map(y => (
                      <SliderRow key={y} label={t.sliderYear(y)}
                        value={perYearRates[y-1]} dimmed={y>year}
                        onChange={v => { const n=[...perYearRates]; n[y-1]=v; setPerYearRates(n); }} />
                    ))
                }
              </div>
              <div style={{ display:"flex", gap:3, marginTop:6 }}>
                {inflRates.map((r, i) => (
                  <div key={i} style={{ flex:1, textAlign:"center" }}>
                    <div style={{
                      height:20, background:"#0b0f1a", borderRadius:3, position:"relative", overflow:"hidden",
                      border: i<year ? "1px solid #ff7a3d44" : "1px solid #1e2540", opacity: i<year ? 1 : 0.3,
                    }}>
                      <div style={{
                        position:"absolute", bottom:0, left:0, right:0,
                        height:`${Math.max(4,(r/0.15)*100)}%`,
                        background:"linear-gradient(to top,#ff7a3d,#ff7a3d88)",
                        transition:"height 0.3s ease",
                      }} />
                    </div>
                    <div style={{ fontSize:8, color: i<year ? "#ff7a3d" : "#3a4060", marginTop:2 }}>{fmtPct(r)}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Tile 4: notes */}
            <div className="tile">
              <div className="tile-label">{t.notesTitle}</div>
              <div style={{ flex:1, display:"flex", flexDirection:"column", justifyContent:"space-around" }}>
                {t.notes.map((n, i) => (
                  <div key={i} style={{ fontSize:12, color:"#8090b8", lineHeight:1.5 }}>· {n}</div>
                ))}
              </div>
              <div style={{ fontSize:11, color:"#6070a0", marginTop:6, letterSpacing:"0.08em" }}>
                pssd.sporicidluhopisycr.cz
              </div>
            </div>
          </div>

          {/* ── RIGHT: results ── */}
          <div className="right-col">

            {/* Bond cards – one per tile, side info layout */}
            {bonds.map((b) => {
              const isMax = b.data.value === maxVal;
              return (
                <div key={b.key} className="tile"
                  style={{
                    borderColor: isMax ? b.color + "66" : "#1e2540",
                    background: isMax ? "#0d1c35" : "#13182a",
                    position:"relative", overflow:"hidden",
                  }}
                >
                  {/* coloured left border accent */}
                  <div style={{ position:"absolute", left:0, top:0, bottom:0, width:3, background:b.color, borderRadius:"10px 0 0 10px" }} />

                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, paddingLeft:8 }}>
                    {/* left: name + sublabel + note */}
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:3 }}>
                        <span style={{ fontSize:16 }}>{b.icon}</span>
                        <span style={{ fontSize:17, fontWeight:700, color:"#fff", fontFamily:"'DM Serif Display',Georgia,serif" }}>{b.label}</span>
                        {isMax && (
                          <span style={{
                            background:b.color, color:"#000", fontSize:8, fontWeight:700,
                            letterSpacing:"0.1em", padding:"2px 6px", borderRadius:4, textTransform:"uppercase", whiteSpace:"nowrap",
                          }}>{t.bestYield}</span>
                        )}
                      </div>
                      <div style={{ fontSize:13, color:"#8090b8", marginBottom:4 }}>{b.sublabel}</div>
                      <div style={{ fontSize:12, color:"#7080a8" }}>⚠ {b.note}</div>
                    </div>

                    {/* right: value + gain + annual */}
                    <div style={{ textAlign:"right", flexShrink:0 }}>
                      <div style={{ fontSize:26, fontWeight:700, color:"#fff", fontFamily:"'DM Serif Display',Georgia,serif", lineHeight:1 }}>
                        {fmt(b.data.value)}
                      </div>
                      <div style={{ fontSize:16, color:b.color, fontWeight:600, marginTop:4 }}>
                        {fmtGain(b.data.gain)}
                      </div>
                      <div style={{ fontSize:12, color:"#8090b8", marginTop:6 }}>
                        {t.annualAvg}: <span style={{ color:"#c8d0e0" }}>{fmt(Math.round(b.data.gain/year))} {t.perYear}</span>
                      </div>
                    </div>
                  </div>

                  {/* bottom progress bar */}
                  <div style={{
                    position:"absolute", bottom:0, left:0, right:0, height:2,
                    background:`linear-gradient(90deg,${b.color}33,${b.color})`,
                  }} />
                </div>
              );
            })}

            {/* Chart tile */}
            <div className="tile">
              <div className="tile-label">{t.chartTitle}</div>
              <svg viewBox="0 0 480 95" style={{ width:"100%", flex:1 }} preserveAspectRatio="none">
                {[0,1,2].map(i => (
                  <line key={i} x1={44} x2={444} y1={10+i*35} y2={10+i*35}
                    stroke="#1e2540" strokeWidth="1" strokeDasharray="4,4" />
                ))}
                {[0,1,2].map(i => {
                  const val = chartMax - (i/2)*(chartMax-chartMin);
                  return (
                    <text key={i} x={40} y={14+i*35} textAnchor="end" fontSize={8} fill="#6070a0">
                      {(val/1_000_000).toFixed(2)}M
                    </text>
                  );
                })}
                {[
                  { data:fixedData,     color:BAR_COLORS.fixed },
                  { data:inflationData, color:BAR_COLORS.inflation },
                  { data:flexiData,     color:BAR_COLORS.flexi },
                ].map(({ data, color }) => (
                  <polyline key={color}
                    points={data.map(d => `${toX(d.year)},${toY(d.value)}`).join(" ")}
                    fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                ))}
                <line x1={toX(year)} x2={toX(year)} y1={2} y2={90}
                  stroke="#ffffff22" strokeWidth="1.5" strokeDasharray="3,3" />
                {[0,1,2,3,4,5].map(y => (
                  <text key={y} x={toX(y)} y={93} textAnchor="middle" fontSize={8} fill="#6070a0">
                    {y}{t.yearShort}
                  </text>
                ))}
              </svg>
              <div style={{ display:"flex", gap:16, marginTop:6, flexWrap:"wrap" }}>
                {[
                  { label:t.legendFixed,                      color:BAR_COLORS.fixed },
                  { label:t.legendInflation(fmtPct(avgInfl)), color:BAR_COLORS.inflation },
                  { label:t.legendFlexi,                      color:BAR_COLORS.flexi },
                ].map(l => (
                  <div key={l.label} style={{ display:"flex", alignItems:"center", gap:5, fontSize:12, color:"#8090b8" }}>
                    <div style={{ width:14, height:3, background:l.color, borderRadius:2 }} />
                    {l.label}
                  </div>
                ))}
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
